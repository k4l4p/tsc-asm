name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check shell scripts
        run: bash -n tests/run.sh tests/bench.sh

      - name: Build
        run: make

      - name: Test
        run: make test
