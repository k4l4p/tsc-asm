name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shell scripts
        run: bash -n tests/run.sh tests/bench.sh

      - name: Build
        run: make

      - name: Test
        run: make test
